<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Lootupspace</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 24px;
      max-width: 400px;
      border: 1px solid #334155;
    }
    h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    button {
      margin-top: 16px;
      background: #f97316;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are currently offline</h1>
    <p>Your internet connection appears disconnected. Reconnect to track pickups, manage stored items, or schedule returns.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
